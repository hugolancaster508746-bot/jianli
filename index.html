<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>王嘉轩 · 能源与动力工程 · 个人简历</title>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --color-primary: #3a5a9c;
            --color-primary-light: #4a6aac;
            --color-secondary: #2d8cf0;
            --color-accent: #4fc3f7;
            --color-accent-glow: rgba(79, 195, 247, 0.25);
            --color-bg: #0e0e1a;
            --color-surface: #18182a;
            --color-text: #e8e8f0;
            --color-text-secondary: #b0b0cc;
            --color-text-muted: #6a6a8a;
            --color-border: #2a2a44;
            --color-shadow: rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --max-width: 1120px;
            --nav-height: 68px;
        }

        /* ===== 基础样式 ===== */
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            -webkit-font-smoothing: antialiased;
        }
        a {
            color: var(--color-secondary);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--color-accent);
        }
        img,
        svg {
            display: block;
            max-width: 100%;
        }
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            box-shadow: 0 2px 20px var(--color-shadow);
            z-index: 1000;
            display: flex;
            align-items: center;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(var(--color-surface-rgb, 255, 255, 255), 0.85);
        }
        /* 由于不能直接用rgba变量，用js控制背景 */
        .navbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--color-primary);
            letter-spacing: 0.5px;
            white-space: nowrap;
            transition: color var(--transition);
        }
        .navbar-brand span {
            color: var(--color-secondary);
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .navbar-links a {
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: var(--radius-sm);
            color: var(--color-text-secondary);
            transition: all var(--transition);
            position: relative;
        }
        .navbar-links a:hover {
            color: var(--color-primary);
            background: var(--color-border);
        }
        .navbar-links a.active {
            color: var(--color-secondary);
            background: var(--color-accent-glow);
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            color: var(--color-text-secondary);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-border);
            line-height: 1;
        }
        .navbar-actions button:hover {
            background: var(--color-primary);
            color: #fff;
            transform: scale(1.05);
        }
        .navbar-actions .print-btn {
            font-size: 1rem;
        }
        .navbar-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--color-text);
            padding: 4px 8px;
        }
        @media (max-width: 820px) {
            .navbar-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                right: 0;
                background: var(--color-surface);
                border-bottom: 1px solid var(--color-border);
                padding: 16px 24px;
                gap: 8px;
                box-shadow: 0 8px 32px var(--color-shadow);
            }
            .navbar-links.open {
                display: flex;
            }
            .navbar-links a {
                padding: 10px 14px;
                width: 100%;
                font-size: 0.95rem;
            }
            .navbar-toggle {
                display: block;
            }
            .navbar-actions button {
                font-size: 1rem;
                padding: 4px 8px;
            }
        }
        @media (max-width: 480px) {
            .navbar-brand {
                font-size: 1rem;
            }
            .navbar-actions button {
                font-size: 0.9rem;
                padding: 4px 6px;
            }
            .navbar-inner {
                padding: 0 16px;
            }
            .container {
                padding: 0 16px;
            }
        }

        /* ===== Hero ===== */
        .hero {
            padding: 48px 0 32px;
            position: relative;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 32px;
            align-items: start;
        }
        .hero-main {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .hero-name {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.2;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-title {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
        }
        .hero-title .tag {
            background: var(--color-accent-glow);
            color: var(--color-secondary);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            -webkit-text-fill-color: var(--color-secondary);
        }
        .hero-bio {
            font-size: 1rem;
            color: var(--color-text-secondary);
            max-width: 640px;
            line-height: 1.7;
            margin-top: 4px;
        }
        .hero-bio strong {
            color: var(--color-text);
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .hero-tags .badge {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
            box-shadow: 0 2px 8px var(--color-shadow);
        }
        .hero-tags .badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--color-shadow);
            border-color: var(--color-secondary);
            color: var(--color-primary);
        }
        .hero-contact {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--color-border);
        }
        .hero-contact-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
        }
        .hero-contact-item .icon {
            font-size: 1.1rem;
        }
        .hero-contact-item .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--color-secondary);
            padding: 2px 8px;
            border-radius: 4px;
            transition: all var(--transition);
            background: var(--color-border);
        }
        .hero-contact-item .copy-btn:hover {
            background: var(--color-secondary);
            color: #fff;
        }
        .hero-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 3.6rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 8px 32px rgba(45, 60, 143, 0.25);
            border: 3px solid var(--color-surface);
            overflow: hidden;
            transition: all var(--transition);
        }
        .hero-photo svg {
            width: 70%;
            height: 70%;
        }
        .hero-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .hero-photo-placeholder {
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: center;
            line-height: 1.3;
        }
        @media (max-width: 680px) {
            .hero-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .hero-photo {
                width: 100px;
                height: 100px;
                font-size: 2.6rem;
                margin: 0 auto;
            }
            .hero-name {
                font-size: 2rem;
                text-align: center;
            }
            .hero-title {
                justify-content: center;
                font-size: 1rem;
            }
            .hero-bio {
                text-align: center;
                font-size: 0.95rem;
            }
            .hero-tags {
                justify-content: center;
            }
            .hero-contact {
                justify-content: center;
            }
            .hero-main {
                align-items: center;
            }
            .hero-photo {
                order: -1;
            }
        }

        /* ===== 亮点成果 ===== */
        .section {
            padding: 40px 0;
            border-bottom: 1px solid var(--color-border);
        }
        .section:last-of-type {
            border-bottom: none;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--color-primary);
        }
        .section-title .emoji {
            font-size: 1.4rem;
        }
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .highlight-card {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: 0 2px 12px var(--color-shadow);
            border: 1px solid var(--color-border);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .highlight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
            opacity: 0.6;
            transition: opacity var(--transition);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px var(--color-shadow);
            border-color: var(--color-secondary);
        }
        .highlight-card:hover::before {
            opacity: 1;
        }
        .highlight-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--color-secondary);
            line-height: 1.2;
        }
        .highlight-label {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }
        .highlight-desc {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-top: 6px;
        }

        /* ===== Tabs ===== */
        .tabs-container {
            margin-top: 8px;
        }
        .tabs-header {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 2px solid var(--color-border);
            margin-bottom: 24px;
        }
        .tabs-header button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all var(--transition);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            font-family: var(--font);
        }
        .tabs-header button:hover {
            color: var(--color-text);
            background: var(--color-border);
        }
        .tabs-header button[aria-selected="true"] {
            color: var(--color-secondary);
            border-bottom-color: var(--color-secondary);
            background: var(--color-accent-glow);
        }
        .tabs-panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tabs-panel[role="tabpanel"] {
            display: none;
        }
        .tabs-panel[role="tabpanel"][aria-hidden="false"] {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 经历卡片 ===== */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .timeline-item {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 12px var(--color-shadow);
            transition: all var(--transition);
        }
        .timeline-item:hover {
            box-shadow: 0 8px 28px var(--color-shadow);
            transform: translateY(-2px);
        }
        .timeline-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 8px;
        }
        .timeline-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--color-text);
        }
        .timeline-sub {
            font-weight: 500;
            color: var(--color-text-secondary);
            font-size: 0.95rem;
        }
        .timeline-date {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            background: var(--color-border);
            padding: 2px 14px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .timeline-body {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
        }
        .timeline-body ul {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
        }
        .timeline-body ul li {
            padding: 3px 0 3px 24px;
            position: relative;
        }
        .timeline-body ul li::before {
            content: '▹';
            position: absolute;
            left: 0;
            color: var(--color-secondary);
            font-weight: 700;
        }
        .timeline-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 1px 12px;
            border-radius: 20px;
            background: var(--color-accent-glow);
            color: var(--color-secondary);
            margin-left: 8px;
            vertical-align: middle;
        }
        .timeline-tag.plan {
            background: #3d2a1a;
            color: #f0a050;
        }

        /* ===== 项目卡片 ===== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 20px 22px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 12px var(--color-shadow);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px var(--color-shadow);
            border-color: var(--color-secondary);
        }
        .project-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--color-text);
        }
        .project-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .project-stack span {
            font-size: 0.7rem;
            background: var(--color-border);
            padding: 2px 12px;
            border-radius: 20px;
            color: var(--color-text-secondary);
            font-weight: 500;
        }
        .project-highlights {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }
        .project-highlights .highlight-tag {
            font-size: 0.72rem;
            background: linear-gradient(135deg, rgba(106, 92, 255, 0.15), rgba(168, 85, 247, 0.12));
            border: 1px solid rgba(106, 92, 255, 0.3);
            padding: 3px 10px;
            border-radius: 20px;
            color: #a78bfa;
            font-weight: 600;
        }
        .project-desc {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
            flex: 1;
        }
        .project-meta {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            border-top: 1px solid var(--color-border);
            padding-top: 10px;
            margin-top: 4px;
        }
        .project-meta a {
            color: var(--color-secondary);
            font-weight: 500;
        }
        .project-status {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--color-text-muted);
            background: var(--color-border);
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            align-self: flex-start;
        }
        .project-qr {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding: 10px 14px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
        }
        .project-qr img {
            width: 64px;
            height: 64px;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .project-qr span {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            line-height: 1.4;
        }

        /* ===== 技能矩阵 ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .skill-category {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 8px var(--color-shadow);
            transition: all var(--transition);
        }
        .skill-category:hover {
            box-shadow: 0 8px 24px var(--color-shadow);
            transform: translateY(-2px);
        }
        .skill-category-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--color-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .skill-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .skill-bar-wrap {
            width: 100%;
        }
        .skill-items .skill-badge {
            background: var(--color-border);
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
        }
        .skill-items .skill-badge:hover {
            background: var(--color-secondary);
            color: #fff;
            transform: scale(1.04);
        }
        .skill-bar-wrap {
            margin-top: 8px;
        }
        .skill-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-bottom: 2px;
        }
        .skill-bar {
            height: 4px;
            background: var(--color-border);
            border-radius: 4px;
            overflow: hidden;
        }
        .skill-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
            transition: width 0.8s ease;
        }

        /* ===== 教育经历 ===== */
        .edu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 680px) {
            .edu-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== 证书与荣誉 ===== */
        .cert-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .cert-main {
            grid-column: 1 / -1;
        }
        @media (max-width: 680px) {
            .cert-grid {
                grid-template-columns: 1fr;
            }
        }
        .edu-item {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 12px var(--color-shadow);
            transition: all var(--transition);
        }
        .edu-item:hover {
            box-shadow: 0 8px 28px var(--color-shadow);
            transform: translateY(-2px);
        }
        .edu-school {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--color-text);
        }
        .edu-major {
            font-weight: 500;
            color: var(--color-text-secondary);
            font-size: 0.95rem;
        }
        .edu-date {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            background: var(--color-border);
            padding: 1px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }
        .edu-details {
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            line-height: 1.7;
        }
        .edu-details ul {
            list-style: none;
            padding: 0;
        }
        .edu-details ul li {
            padding: 2px 0 2px 20px;
            position: relative;
        }
        .edu-details ul li::before {
            content: '·';
            position: absolute;
            left: 0;

                        return `<span class="hero-contact-item"><span class="icon">${item.icon}</span> ${item.label} ${copyBtn}</span>`;
                    }).join('');

                    // 邮箱复制事件
                    contactContainer.querySelectorAll('.copy-btn').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const email = this.getAttribute('data-email');
                            if (email) {
                                // 防爬虫：JS拼接
                                const parts = email.split('@');
                                if (parts.length === 2) {
                                    const full = parts[0] + '@' + parts[1];
                                    navigator.clipboard.writeText(full).then(() => {
                                        const orig = this.textContent;
                                        this.textContent = '✅ 已复制';
                                        setTimeout(() => { this.textContent = orig; }, 1500);
                                    }).catch(() => {
                                        // fallback
                                        const textarea = document.createElement('textarea');
                                        textarea.value = email;
                                        document.body.appendChild(textarea);
                                        textarea.select();
                                        document.execCommand('copy');
                                        document.body.removeChild(textarea);
                                        const orig = this.textContent;
                                        this.textContent = '✅ 已复制';
                                        setTimeout(() => { this.textContent = orig; }, 1500);
                                    });
                                }
                            }
                        });

                if (photoEl && !resume.photo) {

            // ---- 2.8 AI 认证证书图集 ----
            function renderCertImages() {
                const wrapper = document.getElementById('certGalleryWrapper');
                const gallery = document.getElementById('certGallery');
                if (!wrapper || !gallery || !resume.certImages || !resume.certImages.length) return;

                wrapper.style.display = 'block';
                const VISIBLE_COUNT = 4;
                const total = resume.certImages.length;
                const hiddenCount = total - VISIBLE_COUNT;

                // 渲染所有图片（前 4 张可见，其余默认隐藏）
                gallery.innerHTML = resume.certImages.map((img, idx) => {
                    const hidden = idx >= VISIBLE_COUNT ? ' cert-thumb-hidden' : '';
                    return `<div class="cert-thumb${hidden}" data-index="${idx}" role="button" tabindex="0" aria-label="${img.title} - 点击放大">
                        <img src="zhengshu/${encodeURI(img.file)}" alt="${img.title}" loading="lazy" />
                    </div>`;
                }).join('');

                // 若有隐藏图片，添加"展开/收起"方框
                if (hiddenCount > 0) {
                    const moreBtn = document.createElement('div');
                    moreBtn.className = 'cert-thumb cert-more';
                    moreBtn.setAttribute('role', 'button');
                    moreBtn.setAttribute('tabindex', '0');
                    let expanded = false;

                    function renderMoreBtn() {
                        if (expanded) {
                            moreBtn.innerHTML = `<div class="cert-more-inner">
                                <span class="cert-more-dots">▲</span>
                                <span class="cert-more-text">收起</span>
                            </div>`;
                            moreBtn.setAttribute('aria-label', '收起证书');
                            moreBtn.classList.add('cert-collapse');
                            gallery.appendChild(moreBtn);
                        } else {
                            moreBtn.innerHTML = `<div class="cert-more-inner">
                                <span class="cert-more-dots">⋯</span>
                                <span class="cert-more-text">+${hiddenCount}</span>
                            </div>`;
                            moreBtn.setAttribute('aria-label', `展开剩余 ${hiddenCount} 张证书`);
                            moreBtn.classList.remove('cert-collapse');
                            const thirdThumb = gallery.querySelector('.cert-thumb[data-index="3"]');
                            if (thirdThumb) {
                                gallery.insertBefore(moreBtn, thirdThumb.nextSibling);
                            } else {
                                gallery.appendChild(moreBtn);
                            }
                        }
                    }

                    moreBtn.addEventListener('click', () => {
                        expanded = !expanded;
                        gallery.querySelectorAll('.cert-thumb[data-index]').forEach(el => {
                            const idx = parseInt(el.getAttribute('data-index'), 10);
                            if (idx >= VISIBLE_COUNT) {
                                el.classList.toggle('cert-thumb-hidden', !expanded);
                            }
                        });
                        renderMoreBtn();
                        if (!expanded) {
                            const wrapperEl = document.getElementById('certGalleryWrapper');
                            if (wrapperEl) wrapperEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });

                    moreBtn.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            moreBtn.click();
                        }
                    });

                    renderMoreBtn();
                }

                initLightbox();
            }

            // ---- 2.9 Lightbox 交互 ----
            function initLightbox() {
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = document.getElementById('lightboxImg');
                const lightboxCaption = document.getElementById('lightboxCaption');
                const closeBtn = document.getElementById('lightboxClose');
                const prevBtn = document.getElementById('lightboxPrev');
                const nextBtn = document.getElementById('lightboxNext');
                const thumbs = document.querySelectorAll('.cert-thumb[data-index]');
                if (!lightbox || !thumbs.length) return;

                let currentIndex = 0;
                const total = thumbs.length;

                function show(index) {
                    currentIndex = (index + total) % total;
                    const data = resume.certImages[currentIndex];
                    lightboxImg.src = 'zhengshu/' + encodeURI(data.file);
                    lightboxImg.alt = data.title;
                    lightboxCaption.textContent = `${data.title}（${currentIndex + 1} / ${total}）`;
                }

                function open(index) {
                    show(index);
                    lightbox.classList.add('open');
                    lightbox.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                }

                function close() {
                    lightbox.classList.remove('open');
                    lightbox.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                }

                thumbs.forEach((thumb, idx) => {
                    thumb.addEventListener('click', () => open(idx));
                    thumb.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            open(idx);
                        }
                    });
                });

                closeBtn.addEventListener('click', close);
                prevBtn.addEventListener('click', () => show(currentIndex - 1));
                nextBtn.addEventListener('click', () => show(currentIndex + 1));

                // 点击空白处关闭
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) close();
                });

                // 键盘交互
                document.addEventListener('keydown', (e) => {
                    if (!lightbox.classList.contains('open')) return;
                    if (e.key === 'Escape') close();
                    else if (e.key === 'ArrowLeft') show(currentIndex - 1);
                    else if (e.key === 'ArrowRight') show(currentIndex + 1);
                });
            }

            // ---- 2.10 自评（在Hero下方或单独区域） ----
            function renderSelfEval() {
                // 在Hero下方添加自评区域
                const heroSection = document.querySelector('.hero');
                if (heroSection && resume.selfEval) {
                    const existing = document.getElementById('selfEvalContainer');
                    if (existing) existing.remove();

                    const container = document.createElement('div');
                    container.id = 'selfEvalContainer';
                    container.className = 'container';
                    container.style.marginTop = '8px';
                    container.innerHTML = `
                            <div style="background:var(--color-surface); border-radius:var(--radius); padding:16px 24px; border:1px solid var(--color-border); box-shadow:0 2px 12px var(--color-shadow);">
                                <p style="font-size:0.95rem; color:var(--color-text-secondary); line-height:1.8; font-style:italic;">
                                    “${resume.selfEval}”
                                </p>
                            </div>
                        `;
                    heroSection.after(container);
                }
            }

            // ---- 2.11 更新时间 ----
            function renderUpdateTime() {
                const el = document.getElementById('updateTime');
                if (el) {
                    const now = new Date();
                    const y = now.getFullYear();
                    const m = String(now.getMonth() + 1).padStart(2, '0');
                    const d = String(now.getDate()).padStart(2, '0');
                    el.textContent = `📅 最后更新：${y}年${m}月${d}日`;
                }
            }

            // =============================================================
            // 3. Tabs 通用切换逻辑 (ARIA + 键盘)
            // =============================================================
            function setupTabs(tabListId, panelsContainerId) {
                const tabList = document.getElementById(tabListId);
                const panelsContainer = document.getElementById(panelsContainerId);
                if (!tabList || !panelsContainer) return;

                const buttons = tabList.querySelectorAll('button[role="tab"]');
                const panels = panelsContainer.querySelectorAll('.tabs-panel');

                function activateTab(index) {
                    buttons.forEach((btn, i) => {
                        const isActive = i === index;
                        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
                        btn.setAttribute('tabindex', isActive ? '0' : '-1');
                        const panel = document.getElementById(btn.getAttribute('aria-controls'));
                        if (panel) {
                            panel.setAttribute('aria-hidden', isActive ? 'false' : 'true');
                        }
                    });
                    // 聚焦选中的按钮
                    if (buttons[index]) buttons[index].focus();
                }

                buttons.forEach((btn, idx) => {
                    btn.addEventListener('click', function() {
                        activateTab(idx);
                    });

                    btn.addEventListener('keydown', function(e) {
                        const total = buttons.length;
                        let newIdx = idx;
                        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                            e.preventDefault();
                            newIdx = (idx + 1) % total;
                        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                            e.preventDefault();
                            newIdx = (idx - 1 + total) % total;
                        } else if (e.key === 'Home') {
                            e.preventDefault();
                            newIdx = 0;
                        } else if (e.key === 'End') {
                            e.preventDefault();
                            newIdx = total - 1;
                        }
                        if (newIdx !== idx) {
                            activateTab(newIdx);
                        }
                    });
                });

                // 默认激活第一个
                if (buttons.length > 0) {
                    activateTab(0);
                }
            }

            // =============================================================
            // 4. 打印
            // =============================================================
            function initPrint() {
                const btn = document.getElementById('printBtn');
                if (btn) {
                    btn.addEventListener('click', function() {
                        window.print();
                    });
                }
            }

            // =============================================================
            // 5. 返回顶部
            // =============================================================
            function initBackTop() {
                const btn = document.getElementById('backTop');
                if (!btn) return;

                window.addEventListener('scroll', function() {
                    if (window.scrollY > 400) {
                        btn.classList.add('visible');
                    } else {
                        btn.classList.remove('visible');
                    }
                });

                btn.addEventListener('click', function() {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            // =============================================================
            // 6. 移动端导航切换
            // =============================================================
            function initMobileNav() {
                const toggle = document.getElementById('navToggle');
                const links = document.getElementById('navLinks');
                if (!toggle || !links) return;

                toggle.addEventListener('click', function() {
                    const open = links.classList.toggle('open');
                    this.setAttribute('aria-expanded', open ? 'true' : 'false');
                    this.textContent = open ? '✕' : '☰';
                });

                // 点击导航链接后关闭
                links.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', function() {
                        links.classList.remove('open');
                        toggle.setAttribute('aria-expanded', 'false');
                        toggle.textContent = '☰';
                    });
                });
            }

            // =============================================================
            // 7. 导航高亮 (滚动)
            // =============================================================
            function initNavHighlight() {
                const sections = document.querySelectorAll('section[id]');
                const navLinks = document.querySelectorAll('.navbar-links a');

                if (!sections.length || !navLinks.length) return;

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const id = entry.target.id;
                            navLinks.forEach(link => {
                                link.classList.toggle('active', link.getAttribute('href') === '#' +
                                    id);
                            });
                        }
                    });
                }, { threshold: 0.35 });

                sections.forEach(section => observer.observe(section));
            }

            // =============================================================
            // 8. 初始化
            // =============================================================
            function init() {
                renderHero();
                renderHighlights();
                renderExperience();
                renderProjects();
                renderSkills();
                renderEducation();
                renderCertificates();
                renderCertImages();
                renderSelfEval();
                renderUpdateTime();

                initPrint();
                initBackTop();
                initMobileNav();
                initNavHighlight();

                // 导航栏背景（深色模式）
                const navbar = document.querySelector('.navbar');
                if (navbar) {
                    navbar.style.background = 'rgba(14,14,26,0.88)';
                }
            }

            // DOM 就绪
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
